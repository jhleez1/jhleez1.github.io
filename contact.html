<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Jihan Lee</title>
<meta name="description" content="Get in touch with Jihan Lee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
<!-- BODY:START -->
<main id="main">
  <section class="section hero-contact">
    <div class="wrap contact-grid">
      <div class="contact-copy" id="contactCopy"></div>
      <form class="contact-form" id="contactForm" novalidate>
        <div class="field"><label for="cfName">Your name</label><input id="cfName" name="name" autocomplete="name" required></div>
        <div class="field"><label for="cfEmail">Your email</label><input id="cfEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="cfMsg">Message</label><textarea id="cfMsg" name="message" rows="5" required></textarea></div>
        <button class="btn primary" type="submit">Write the email</button>
        <p class="form-msg" id="cfStatus" role="status"></p>
      </form>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="github-snapshot.js"></script>
<script src="app.js"></script>
<!-- BODY:END -->
</body>
</html>
